<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Travel Command Center</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#004a99;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    margin-top:0;
}

a{
    display:block;
    margin-bottom:8px;
    color:#0066cc;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<h1>✈️ Travel Command Center</h1>

<div class="row">

    <div class="card">
        <h2>🌤️ Weer</h2>
        <div id="weather"></div>
    </div>

    <div class="card">
        <h2>🌪️ Storm Monitoring</h2>

        https://www.weather.gov/cphc/

        https://www.nhc.noaa.gov/
            National Hurricane Center
        </a>

        https://www.tropicaltidbits.com/
            Tropical Tidbits
        </a>

        zoom.earth/" target="_blank">
            Zoom Earth
        </a>

        https://www.windy.com/

    </div>

</div>

</div>

<script>

const locations = [

{
    name:"Denver",
    latitude:39.7392,
    longitude:-104.9903
},
{
    name:"Moab",
    latitude:38.5733,
    longitude:-109.5498
},
{
    name:"Monument Valley",
    latitude:36.9980,
    longitude:-110.0985
},
{
    name:"Page",
    latitude:36.9147,
    longitude:-111.4558
},
{
    name:"Las Vegas",
    latitude:36.1699,
    longitude:-115.1398
},
{
    name:"Honolulu",
    latitude:21.3069,
    longitude:-157.8583
},
{
    name:"Volcano",
    latitude:19.4194,
    longitude:-155.2885
},
{
    name:"Kailua-Kona",
    latitude:19.6400,
    longitude:-155.9969
},
{
    name:"Kihei",
    latitude:20.7850,
    longitude:-156.4656
}

];

async function loadWeather(){

    let html = "";

    for(const location of locations){

        try{

            const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m`;

            const response =
            await fetch(url);

            const data =
            await response.json();

            html += `
                <p>
                <strong>${location.name}</strong><br>
                ${data.current.temperature_2m}°C
                </p>
            `;

        }
        catch{

            html += `
                <p>
                ${location.name}: fout
                </p>
            `;
        }
    }

    document.getElementById("weather").innerHTML =
    html;
}

loadWeather();
  
</script>
  
</body>

</html>
