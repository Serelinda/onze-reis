<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Travel Command Center</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#004a99;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    margin-top:0;
}

a{
    display:block;
    margin-bottom:8px;
    color:#0066cc;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
    
#stormStatus{
    font-size:24px;
    font-weight:bold;
}

#todayLocation{
    font-size:24px;
    font-weight:bold;
}

#countdown{
    font-size:22px;
    color:#004a99;
}

#weather{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
}

.weatherCard{
    background:#f5f7fa;
    padding:10px;
    border-radius:10px;
}    

</style>
</head>

<body>

<div class="container">

    <h1>✈️ Travel Command Center</h1>



    <!-- LINKS -->

    <div class="row">

        <div class="card">

            <h2>🌪️ Storm Monitoring</h2>

            <a href="https://www.weather.gov/cphc/"
               target="_blank">
               National Hurricane Center
            </a>

            <a href="https://www.tropicaltidbits.com/"
               target="_blank">
               Tropical Tidbits
            </a>

            <a href="https://zoom.earth/"
               target="_blank">
               Zoom Earth
            </a>

            <a href="https://www.windy.com/"
               target="_blank">
               Windy
            </a>

        </div>

        <div class="card">
        
            <h2>🏝️ Hawaii Alerts</h2>

            <a href="https://www.nhc.noaa.gov/gtwo.php?basin=cpac"
               target="_blank">
               Central Pacific Hurricane Center
            </a>
            
            <a href="https://www.weather.gov/hfo/"
               target="_blank">
               Hawaii Weather Forecast Office
            </a>
        
            <a href="https://www.tsunami.gov/"
               target="_blank">
               Tsunami Warning Center
            </a>
        
            <a href="https://www.usgs.gov/volcanoes/kilauea"
               target="_blank">
               Kīlauea Volcano Updates
            </a>
        
        </div>

    </div>

    <!-- WEER -->

    <div class="row">

        <div class="card">

            <h2>🌤️ Weer</h2>

            <div id="weather"></div>

        </div>

    </div>
    
</div>


<script>

const locations = [

{
    name:"Brussel",
    latitude:50.8503,
    longitude:4.3517,
    timezone:"Europe/Brussels"
},
    
{
    name:"2 - 4 September - Denver ",
    latitude:39.7392,
    longitude:-104.9903,
    timezone:"America/Denver"
},
{
    name:"4 - 5 September - Moab",
    latitude:38.5733,
    longitude:-109.5498,
    timezone:"America/Denver"
},
{
    name:"5 - 6 September - Monument Valley",
    latitude:36.9980,
    longitude:-110.0985,
    timezone:"America/Denver"
},
{
    name:"6 - 7 September - Page",
    latitude:36.9147,
    longitude:-111.4558,
    timezone:"America/Phoenix"
},
{
    name:"7 - 8 September - Bryce Canyon City",
    latitude:37.6720,
    longitude:-112.1560,
    timezone:"America/Denver"
},
{
    name:"8 - 9 September - Zion National Park",
    latitude:37.2982,
    longitude:-113.0263,
    timezone:"America/Denver"
},
{
    name:"9 - 10 September - Las Vegas",
    latitude:36.1699,
    longitude:-115.1398,
    timezone:"America/Los_Angeles"
},
{
    name:"10 - 11 September - Furnace Creek",
    latitude:36.4570,
    longitude:-116.8669,
    timezone:"America/Los_Angeles"
},
{
    name:"11 - 13 September - Anaheim",
    latitude:33.8366,
    longitude:-117.9143,
    timezone:"America/Los_Angeles"
},
{
    name:"14 - 16 September - Honolulu",
    latitude:21.3069,
    longitude:-157.8583,
    timezone:"Pacific/Honolulu"
},
{
    name:"16 - 18 September - Volcano",
    latitude:19.4194,
    longitude:-155.2885,
    timezone:"Pacific/Honolulu"
},
{
    name:"18 - 20 September - Kailua-Kona",
    latitude:19.6400,
    longitude:-155.9969,
    timezone:"Pacific/Honolulu"
},
{
    name:"20 - 23 September - Kihei",
    latitude:20.7850,
    longitude:-156.4656,
    timezone:"Pacific/Honolulu"
},

{
    name:"Montreal",
    latitude:45.5019,
    longitude:-73.5674,
    timezone:"America/Toronto"
}

];

async function loadWeather(){

    let html = "";

    for(const location of locations){

        try{

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

            const response =
            await fetch(url);

            const data =
            await response.json();

            const localTime =
                new Date().toLocaleTimeString(
                    "nl-BE",
                    {
                        timeZone: location.timezone,
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
            
            html += `
            <div class="weatherCard">
            
                <strong>${location.name}</strong><br>
            
                🕒 ${localTime}<br>
            
                🌡️ ${data.current.temperature_2m}°C<br>
            
                ⬆️ ${data.daily.temperature_2m_max[0]}°C
            
                ⬇️ ${data.daily.temperature_2m_min[0]}°C
            
            </div>
            `;

        }
        catch{

            html += `
                <p>
                ${location.name}: fout
                </p>
            `;
        }
    }

    document.getElementById("weather").innerHTML =
    html;
}


function determineCurrentLocation(){

    const today = new Date();

    const day = today.getDate();

    let location = "België";

    if(day >= 2 && day <= 3) location = "Denver";
    else if(day === 4) location = "Moab";
    else if(day === 5) location = "Monument Valley";
    else if(day === 6) location = "Page";
    else if(day === 7) location = "Bryce Canyon";
    else if(day === 8) location = "Zion";
    else if(day === 9) location = "Las Vegas";
    else if(day === 10) location = "Death Valley";
    else if(day >= 11 && day <= 13) location = "Anaheim";
    else if(day >= 14 && day <= 15) location = "Honolulu";
    else if(day >= 16 && day <= 17) location = "Volcanoes NP";
    else if(day >= 18 && day <= 19) location = "Kailua-Kona";
    else if(day >= 20 && day <= 23) location = "Maui";

    document.getElementById("todayLocation").innerHTML =
    `📍 Vandaag bevinden we ons in <strong>${location}</strong>`;
}

   
  
loadWeather();
    
determineCurrentLocation();
    
</script>
  
</body>

</html>
